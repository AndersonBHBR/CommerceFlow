# Exemplo apenas. Não versione segredos reais; crie commerceflow-secrets no cofre do cluster.
apiVersion: v1
kind: Secret
metadata:
  name: commerceflow-secrets
  namespace: commerceflow
type: Opaque
stringData:
  Jwt__SigningKey: substitua-por-um-segredo-aleatorio-com-32-bytes-ou-mais
  RabbitMq__Password: substitua-pelo-segredo-do-broker
  ConnectionStrings__SalesDatabase: Server=sales-sql.example.internal,1433;Database=CommerceFlowSales;User Id=commerceflow;Password=SUBSTITUA;Encrypt=True;TrustServerCertificate=False
  ConnectionStrings__InventoryDatabase: Server=inventory-sql.example.internal,1433;Database=CommerceFlowInventory;User Id=commerceflow;Password=SUBSTITUA;Encrypt=True;TrustServerCertificate=False
